<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>शर्मा टी स्टॉल | Highway Radio</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ffb703">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --amber-gold: #ffb703;
      --glass-panel: rgba(18, 9, 5, 0.94);
      --glass-border: rgba(255, 255, 255, 0.16);
      --linkedin-blue: #0077b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #0e0603;
      color: #fff;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .app-root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      z-index: 10;
    }

    .bg-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      filter: brightness(0.92);
      transition: filter 0.4s ease, transform 0.6s ease;
    }

    .screen-overlay {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 35%, rgba(0,0,0,0.1) 25%, rgba(12, 5, 2, 0.72) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .beat-glow-layer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at 50% 50%, rgba(255, 140, 0, 0.35) 0%, rgba(255, 69, 0, 0.15) 50%, transparent 80%);
      transition: opacity 0.4s ease;
    }

    body.playing .beat-glow-layer {
      opacity: 1;
      animation: ambientBeatPulse 1.1s infinite alternate ease-in-out;
    }

    body.playing .bg-canvas {
      filter: brightness(1.04) contrast(1.05);
      transform: scale(1.02);
    }

    @keyframes ambientBeatPulse {
      0% { opacity: 0.35; transform: scale(0.99); }
      50% { opacity: 0.95; transform: scale(1.015); }
      100% { opacity: 0.45; transform: scale(1); }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      z-index: 20;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-lbl {
      font-size: 0.95rem;
      font-weight: 700;
      color: #eeddcc;
    }

    .online-tag {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.78rem;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 4px 12px;
      border-radius: 99px;
      color: #dfcebe;
      backdrop-filter: blur(10px);
    }

    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 10px #22c55e;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-btn {
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      text-decoration: none;
      color: #fff;
      transition: transform 0.15s ease, filter 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .action-btn:active { transform: scale(0.92); }

    .playlist-toggle-btn {
      background: linear-gradient(135deg, rgba(255, 183, 3, 0.35), rgba(211, 84, 0, 0.5));
      border: 1px solid var(--amber-gold);
      box-shadow: 0 0 12px rgba(255, 183, 3, 0.3);
    }

    .marwadi-voice-btn {
      background: linear-gradient(135deg, rgba(230, 126, 34, 0.5), rgba(211, 84, 0, 0.4));
      border-color: #f39c12;
    }

    .truck-horn-btn {
      background: linear-gradient(135deg, rgba(255, 111, 0, 0.8), rgba(216, 67, 21, 0.65));
      border: 1px solid #ffb300;
      box-shadow: 0 0 14px rgba(255, 111, 0, 0.45);
    }

    .linkedin-btn {
      background: linear-gradient(135deg, rgba(0, 119, 181, 0.8), rgba(0, 85, 130, 0.7));
      border-color: rgba(255, 255, 255, 0.3);
    }

    .linkedin-icon {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      pointer-events: none;
      margin-top: -30px;
      padding: 0 20px;
      z-index: 20;
    }

    .stall-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      perspective: 800px;
    }

    .hindi-3d-title {
      font-family: 'Yatra One', cursive;
      font-size: clamp(3.2rem, 8vw, 6.2rem);
      line-height: 1.05;
      color: #fffbf0;
      letter-spacing: 2px;
      text-shadow: 
        0 1px 0 #ffe082,
        0 2px 0 #ffd54f,
        0 3px 0 #ffca28,
        0 4px 0 #ffb300,
        0 5px 0 #e67e22,
        0 6px 0 #d35400,
        0 7px 0 #a04000,
        0 8px 0 #6e2c00,
        0 10px 18px rgba(0, 0, 0, 0.8),
        0 20px 35px rgba(0, 0, 0, 0.95);
      transform: perspective(600px) rotateX(4deg);
      display: inline-block;
      filter: drop-shadow(0 15px 25px rgba(0,0,0,0.85));
      animation: stallFloat 3.5s ease-in-out infinite alternate;
    }

    @keyframes stallFloat {
      0% { transform: translateY(0px) rotateX(4deg); }
      100% { transform: translateY(-8px) rotateX(2deg); }
    }

    body.playing .hindi-3d-title {
      animation: beatTitleRhythm 0.8s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes beatTitleRhythm {
      0% { transform: perspective(600px) rotateX(4deg) scale(1); }
      50% {
        transform: perspective(600px) rotateX(1deg) scale(1.05);
        color: #ffffff;
        text-shadow: 
          0 1px 0 #fff8e1,
          0 2px 0 #ffe082,
          0 4px 0 #ffca28,
          0 6px 0 #ffb300,
          0 8px 0 #fb8c00,
          0 10px 0 #e65100,
          0 14px 22px rgba(255, 152, 0, 0.8),
          0 22px 35px rgba(255, 87, 34, 0.6),
          0 32px 50px rgba(0, 0, 0, 0.95);
        filter: drop-shadow(0 18px 30px rgba(255, 140, 0, 0.5));
      }
      100% { transform: perspective(600px) rotateX(3deg) scale(1.02); }
    }

    .sub-tagline {
      font-size: clamp(0.85rem, 2.3vw, 1.05rem);
      font-weight: 700;
      letter-spacing: 2px;
      color: #ffe8d6;
      margin-top: 14px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      transition: color 0.3s;
    }

    body.playing .sub-tagline { color: var(--amber-gold); }

    footer {
      padding: 0 16px 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 20;
    }

    .player-dock {
      width: 100%;
      max-width: 680px;
      background: var(--glass-panel);
      backdrop-filter: blur(25px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 12px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95);
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .disc-wrapper {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2px solid var(--amber-gold);
      overflow: hidden;
      flex-shrink: 0;
      background: #000;
      box-shadow: 0 0 16px rgba(255, 183, 3, 0.35);
    }

    .disc-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      animation: spinTrack 10s linear infinite;
      animation-play-state: paused;
    }

    @keyframes spinTrack { 100% { transform: rotate(360deg); } }

    .track-details { flex: 1; text-align: left; min-width: 0; }

    .track-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-singer { 
      font-size: 0.74rem; 
      color: #ffb77d; 
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-line {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .line-bg {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 99px;
      cursor: pointer;
    }

    .line-fill {
      width: 0%;
      height: 100%;
      background: var(--amber-gold);
      border-radius: 99px;
      pointer-events: none;
    }

    .time-tag {
      font-size: 0.72rem;
      font-weight: 600;
      color: #dfcebe;
      min-width: 32px;
      font-variant-numeric: tabular-nums;
    }

    .controls { display: flex; align-items: center; gap: 12px; }

    .btn-icon {
      background: none;
      border: none;
      color: #eee;
      font-size: 1.35rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .btn-icon:active { transform: scale(0.9); }

    .btn-play {
      width: 50px;
      height: 50px;
      background: #fff;
      color: #111;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      cursor: pointer;
      border: none;
      box-shadow: 0 4px 15px rgba(255, 183, 3, 0.4);
      transition: background 0.2s, transform 0.1s;
    }
    .btn-play:hover { background: var(--amber-gold); }
    .btn-play:active { transform: scale(0.92); }

    .vol-box { display: flex; align-items: center; gap: 6px; }
    .vol-slider { width: 60px; accent-color: var(--amber-gold); cursor: pointer; }

    /* Sliding Drawer Styles */
    .playlist-drawer {
      position: fixed;
      top: 0;
      right: -380px;
      width: min(360px, 86vw);
      height: 100vh;
      background: rgba(14, 6, 3, 0.97);
      backdrop-filter: blur(25px);
      border-left: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: -15px 0 40px rgba(0, 0, 0, 0.9);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: right 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .playlist-drawer.open { right: 0; }

    .drawer-header {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .drawer-header h3 {
      font-size: 1.05rem;
      color: var(--amber-gold);
      font-weight: 800;
    }

    .close-btn {
      background: none;
      border: none;
      color: #dfcebe;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .song-list-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      border: 1px solid transparent;
    }

    .song-item:hover {
      background: rgba(255, 183, 3, 0.15);
    }

    .song-item.active {
      background: rgba(255, 183, 3, 0.22);
      border-color: var(--amber-gold);
    }

    .song-item-idx {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--amber-gold);
      min-width: 28px;
    }

    .song-item-meta { flex: 1; min-width: 0; text-align: left; }

    .song-item-name {
      font-size: 0.86rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-item-sub {
      font-size: 0.72rem;
      color: #cbb9a9;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .drawer-overlay.active { opacity: 1; pointer-events: auto; }

    @media (max-width: 768px) {
      header { padding: 10px 14px; }
      main { margin-top: -15px; }
      .vol-box { display: none; }
      .player-dock { padding: 10px 14px; }
      .action-btn { font-size: 0.7rem; padding: 5px 10px; }
    }
  </style>
</head>

    let currentIdx = 0;
    const audio = new Audio();
    audio.preload = "auto";

    const playBtn = document.getElementById('b-play');
    const prevBtn = document.getElementById('b-prev');
    const nextBtn = document.getElementById('b-next');
    const trackName = document.getElementById('track-name');
    const trackArtist = document.getElementById('track-artist');
    const discThumb = document.getElementById('disc-thumb');
    const lineFill = document.getElementById('line-fill');
    const tCur = document.getElementById('t-cur');
    const tDur = document.getElementById('t-dur');
    const stationStatus = document.getElementById('station-status');
    const drawerCountTitle = document.getElementById('drawer-count-title');

    function loadSong(idx) {
      currentIdx = idx;
      const s = playlist[idx];
      audio.src = 'songs/' + encodeURIComponent(s.file);
      trackName.innerText = s.title;
      trackArtist.innerText = s.artist;
      lineFill.style.width = '0%';
      tCur.innerText = '0:00';
      tDur.innerText = '0:00';
      highlightActiveTrack(idx);
    }

    function togglePlay() {
      if (audio.paused) {
        audio.play().then(() => {
          document.body.classList.add('playing');
          playBtn.innerText = '⏸';
          discThumb.style.animationPlayState = 'running';
          stationStatus.innerText = 'Playing Live 🎶';
        }).catch(err => {
          console.error("Playback restriction:", err);
          stationStatus.innerText = 'Click Play';
        });
      } else {
        audio.pause();
        document.body.classList.remove('playing');
        playBtn.innerText = '▶';
        discThumb.style.animationPlayState = 'paused';
        stationStatus.innerText = 'Radio Paused';
      }
    }

    function nextTrack() {
      currentIdx = (currentIdx + 1) % playlist.length;
      loadSong(currentIdx);
      audio.play().then(() => {
        document.body.classList.add('playing');
        playBtn.innerText = '⏸';
        discThumb.style.animationPlayState = 'running';
      });
    }

    function prevTrack() {
      currentIdx = (currentIdx - 1 + playlist.length) % playlist.length;
      loadSong(currentIdx);
      audio.play().then(() => {
        document.body.classList.add('playing');
        playBtn.innerText = '⏸';
        discThumb.style.animationPlayState = 'running';
      });
    }

    function fmtTime(sec) {
      if (isNaN(sec) || !sec) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    audio.addEventListener('timeupdate', () => {
      if (audio.duration) {
        lineFill.style.width = (audio.currentTime / audio.duration * 100) + '%';
        tCur.innerText = fmtTime(audio.currentTime);
        tDur.innerText = fmtTime(audio.duration);
      }
    });

    audio.addEventListener('ended', nextTrack);

    function seekSong(e) {
      if (!audio.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const ratio = (e.clientX - rect.left) / rect.width;
      audio.currentTime = ratio * audio.duration;
    }

    function changeVol(v) { audio.volume = v / 100; }

    function toggleDrawer() {
      document.getElementById('playlist-drawer').classList.toggle('open');
      document.getElementById('drawer-overlay').classList.toggle('active');
    }

    function renderPlaylistUI() {
      const container = document.getElementById('song-list-scroll');
      container.innerHTML = '';
      drawerCountTitle.innerText = `📻 Radio Playlist (${playlist.length} Tracks)`;

      playlist.forEach((song, idx) => {
        const item = document.createElement('div');
        item.className = `song-item ${idx === currentIdx ? 'active' : ''}`;
        item.id = `song-item-${idx}`;
        item.onclick = () => {
          loadSong(idx);
          audio.play().then(() => {
            document.body.classList.add('playing');
            playBtn.innerText = '⏸';
            discThumb.style.animationPlayState = 'running';
          });
          toggleDrawer();
        };

        item.innerHTML = `
          <div class="song-item-idx">${idx + 1}</div>
          <div class="song-item-meta">
            <div class="song-item-name">${song.title}</div>
            <div class="song-item-sub">${song.artist}</div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function highlightActiveTrack(idx) {
      document.querySelectorAll('.song-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`song-item-${idx}`);
      if (activeEl) {
        activeEl.classList.add('active');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
    }

    function speakRamRamSa() {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance("राम राम सा! पधारो म्हारे देश! शर्मा टी स्टॉल री कड़क चाय और हाईवे 90s रेडियो तैय्यार है सा!");
      utterance.lang = 'hi-IN';
      utterance.pitch = 0.86;
      window.speechSynthesis.speak(utterance);
    }

    // Iconic Desi Truck Musical Horn (Multi-tone Highway Tune)
    function blowTruckHorn() {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      const ctx = new AudioCtx();

      const hornTune = [
        { f: 440, d: 0.12, p: 0.04 },
        { f: 494, d: 0.12, p: 0.04 },
        { f: 523, d: 0.14, p: 0.04 },
        { f: 494, d: 0.12, p: 0.04 },
        { f: 440, d: 0.14, p: 0.05 },
        { f: 392, d: 0.14, p: 0.04 },
        { f: 440, d: 0.35, p: 0.08 },
        { f: 523, d: 0.16, p: 0.04 },
        { f: 587, d: 0.45, p: 0.00 }
      ];

      let startTime = ctx.currentTime + 0.02;

      hornTune.forEach((note) => {
        const pipes = [note.f, note.f * 1.5];

        pipes.forEach((freq) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();

          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, startTime);
          osc.frequency.exponentialRampToValueAtTime(freq * 1.03, startTime + note.d);

          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.linearRampToValueAtTime(0.18, startTime + 0.02);
          gain.gain.setValueAtTime(0.18, startTime + note.d - 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + note.d);

          osc.connect(gain);
          gain.connect(ctx.destination);

          osc.start(startTime);
          osc.stop(startTime + note.d);
        });

        startTime += note.d + note.p;
      });
    }

    playBtn.addEventListener('click', togglePlay);
    nextBtn.addEventListener('click', nextTrack);
    prevBtn.addEventListener('click', prevTrack);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.key.toLowerCase() === 'n') {
        nextTrack();
      } else if (e.key.toLowerCase() === 'p') {
        prevTrack();
      }
    });

    setInterval(() => {
      const d = new Date();
      document.getElementById('live-clock').innerText = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }, 1000);

    renderPlaylistUI();
    loadSong(0);
  </script>
</body>
</html>
